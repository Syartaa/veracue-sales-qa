  <rect width="32" height="32" rx="8" fill="#6f42b5"/>
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="8" y1="13" x2="8" y2="19"/>
    <line x1="12" y1="9" x2="12" y2="23"/>
    <line x1="16" y1="6" x2="16" y2="26"/>
    <line x1="20" y1="10" x2="20" y2="22"/>
    <line x1="24" y1="14" x2="24" y2="18"/>
  </g>
</svg>
